# Rebuilds the GM atlas in this private repo when something changed:
# - when placements saved from the site's edit mode ("Gem for alle") arrive as moves/*.json
# - every night, to pick up newly published notes
# - on demand (Actions tab -> Rebuild atlas -> Run workflow)
# It does not publish the players' edition: run `python3 tools/build.py --players ../Arendur-Atlas`
# locally and push the public repo. If the build reports a problem, the run fails.
name: Rebuild atlas

on:
  push:
    branches: [main]
    paths: ["moves/*.json"]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: rebuild-atlas

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply saved moves
        run: |
          shopt -s nullglob
          files=(moves/*.json)
          for f in "${files[@]}"; do python3 tools/apply_moves.py "$f"; done
          if [ ${#files[@]} -gt 0 ]; then git rm -q "${files[@]}"; fi

      - name: Build
        run: python3 tools/build.py

      - name: Commit and push if anything changed
        id: commit
        run: |
          # index.html only gets a new version stamp; without other changes there is nothing to publish.
          if git diff --quiet HEAD -- data tools moves; then git checkout -- index.html; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild atlas (${{ github.event_name }})"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

