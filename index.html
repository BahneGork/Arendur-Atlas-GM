<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow"> <!-- GM edition; removed in the players' edition -->
  <title>Atlas over Arendur</title>
  <meta name="description" content="Interaktivt atlas over Arendur Rising – Ursia, East Blackwood og Delios, som Skyggekompagniet kender dem.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%239e2b25'/%3E%3Cpath d='M16 7l2.6 6 6.4.5-4.9 4.2 1.5 6.3L16 20.6 10.4 24l1.5-6.3L7 13.5l6.4-.5z' fill='%23f3e9d2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/atlas.css?v=20261016145135">
</head>
<body>
  <div id="map" aria-label="Kort"></div>

  <header class="cartouche">
    <h1><span class="small">Atlas over</span> Arendur</h1>
    <nav class="map-tabs" aria-label="Kort"></nav>
  </header>

  <div class="search">
    <label class="visually-hidden" for="search-input">Søg efter sted</label>
    <input id="search-input" type="search" placeholder="Søg efter et sted…" autocomplete="off">
    <ul class="search-results" role="listbox" hidden></ul>
  </div>

  <aside class="panel" aria-live="polite" hidden>
    <button class="panel-close" type="button" aria-label="Luk">×</button>
    <div class="panel-body"></div>
  </aside>

  <div class="legend">
    <button class="legend-toggle" type="button" aria-expanded="false">Signaturer</button>
    <div class="legend-body" hidden>
      <ul class="legend-keys">
        <li><span class="pin-sample visited"></span> Besøgt</li>
        <li><span class="pin-sample"></span> Kun hørt om</li>
        <li><span class="pin-sample approx"></span> Omtrentlig placering</li>
        <li hidden><span class="pin-sample travel"></span> Teleportationscirkel o.l.</li>
        <li hidden><span class="pin-sample travel lost"></span> Rejsemulighed vi har glemt</li>
      </ul>
      <label hidden><input type="checkbox" id="opt-regions" checked> Baroniernes grænser</label>
      <label><input type="checkbox" id="opt-visited"> Kun steder vi har besøgt</label>
      <label hidden><input type="checkbox" id="opt-travel"> Kun rejsemuligheder (teleportation o.l.)</label>
      <label><input type="checkbox" id="opt-edit"> Redigér placeringer</label>
    </div>
  </div>

  <section class="journey" aria-label="Rejsen">
    <button class="journey-toggle" type="button" aria-expanded="false">
      <span class="journey-toggle-icon" aria-hidden="true">✦</span> Rejsen
    </button>
    <div class="journey-body" hidden>
      <div class="journey-card"></div>
      <div class="journey-controls">
        <button type="button" data-step="-1" aria-label="Forrige">‹</button>
        <button type="button" class="journey-play" aria-label="Afspil rejsen">▶</button>
        <button type="button" data-step="1" aria-label="Næste">›</button>
      </div>
      <ol class="journey-strip"></ol>
    </div>
  </section>

  <div class="editbar" hidden>
    <p class="editbar-title">Redigering – træk stederne på plads</p>
    <p class="editbar-status"></p>
    <div class="editbar-actions">
      <button type="button" data-act="publish">Gem for alle</button>
      <button type="button" data-act="copy">Kopiér ændringer</button>
      <button type="button" data-act="reset">Fortryd alle</button>
      <button type="button" data-act="done">Færdig</button>
    </div>
    <details class="unplaced">
      <summary>Uplacerede steder <span class="unplaced-count"></span></summary>
      <ul class="unplaced-list"></ul>
    </details>
    <textarea class="editbar-export" readonly hidden aria-label="Ændringer"></textarea>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/marked/marked.min.js"></script>
  <script>window.ATLAS_VERSION = "20261016145135";</script>
  <script src="js/atlas.js?v=20261016145135"></script>
</body>
</html>
